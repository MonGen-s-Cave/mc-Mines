prefix: "&#758CE3[Mines]"

messages:
  reload: "%prefix% &aYou have successfully reloaded the files!"
  no-permission: "%prefix% &cYou don't have permission to do this."
  player-required: "%prefix% &cOnly players can use this."

  commands:
    mine-not-found: '%prefix% &cMine not found!'
    reset-success: '%prefix% &aMine successfully reset!'

  wand:
    start-mine: "%prefix% &7Selection started for the &emine area&7. &8(Left: Pos1, Right: Pos2)"
    start-entrance: "%prefix% &7Selection started for the &bentrance area&7. &8(Left: Pos1, Right: Pos2)"
    hint-save: "%prefix% &7To save: &fSHIFT + right click"
    need-both: "%prefix% &cSelect both positions first!"
    pos1: "%prefix% &aPos1 set!"
    pos2: "%prefix% &aPos2 set!"
    done-mine: "%prefix% &aMine area updated!"
    done-entrance: "%prefix% &aEntrance area updated!"
    cancelled: "%prefix% &7Selection cancelled."
    no-space: "%prefix% &cThere is no space in your inventory for the wand!"
    item:
      name: "&6Selection Wand"
      lore1: "&7Left click: &fPos1"
      lore2: "&7Right click: &fPos2"
      lore3: "&7Save: &fSHIFT + right click"

  prompt:
    create:
      name:
        start: "%prefix% &eType the name of the new mine (A-Za-z0-9_-, max 32)."
        invalid: "%prefix% &cInvalid name format!"
        exists: "%prefix% &cA mine with this name already exists: {name}"
      reset:
        start: "%prefix% &7Type the reset time in seconds (&f1..86400&7). Empty / '-' = &f300&7."
        invalid-number: "%prefix% &cInvalid number!"
        out-of-range: "%prefix% &cThe reset time must be between &f1..86400&c."
      success: "%prefix% &aMine created: &f{name}&7 (&f{seconds}s&7)."

    editor:
      set-reset:
        start: "%prefix% &7Type the &fnew reset time &7in seconds (&8e.g. &f300&8)&7!"
        range: "%prefix% &cThe given time is out of range. &7(1..86400)"
        success: "%prefix% &aSuccess! &7Reset time: &f{seconds}s"
        invalid: "%prefix% &cInvalid number format!"
      rename-display:
        start: '%prefix% &7Type the new display name!'
        success: '%prefix% &aDisplay name successfully changed: &f{name}'
      rename:
        start: "%prefix% &7Type the new mine name &8(&71-32 letters/digits, _ -&8)&7:"
        invalid: "%prefix% &cInvalid name! &7Only letters/digits, '_' and '-' are allowed (1-32)."
        exists: "%prefix% &cA mine with this name already exists: &f{name}"
        success: "%prefix% &aRenamed to: &f{name}"
      set-permission:
        start: "%prefix% &7Type the &fentrance permission&7, or &f-&7 to clear it!"
        cleared: "%prefix% &aEntrance permission cleared."
        set: "%prefix% &aEntrance permission set: &f{permission}"
      teleport:
        start: "%prefix% &7Stand where you want the players to be teleported!"
        set: "%prefix% &aRecovery location set: &f{world} &7(&f{x}&7, &f{y}&7, &f{z}&7)"
        cleared: "%prefix% &aRecovery location cleared."

      blocks:
        add:
          id: "%prefix% &7Type the block identifier &8(e.g. &fstone&8, &fnexo:amber_block&8)&7:"
          invalid: "%prefix% &cInvalid block: &f{input} &8(&7{error}&8)"
          chance: "%prefix% &7Type chance % &8(1..100)&7 for: &f{key}"
          chance-invalid: "%prefix% &cInvalid chance! Please enter a number."
          chance-range: "%prefix% &cChance must be between &f1 &cand &f100&c."
        removed: "%prefix% &aRemoved: &f{key}"
        added: "%prefix% &aAdded: &f{key} &7- &a{chance}%"

  mine:
    teleported-out: "%prefix% &eThis mine is resetting, so you were teleported to safety!"

  entrance:
    no-permission: "%prefix% &cYou don't have permission to enter this zone. &4({permission})"

  actionbar:
    mine-status: "&6{mine} &7| Reset: &e{reset_countdown} &7| Remaining: &e{remaining_percent}"

version: '1'
